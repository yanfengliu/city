name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout city
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          path: city
          persist-credentials: false

      # Both file:../ sibling dependencies deliberately track main: local dev
      # consumes the live sibling repos, and the fleet co-evolves in lockstep.
      # Build each dist so city's install resolves exactly like local dev.
      - name: Checkout civ-engine (sibling)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: yanfengliu/civ-engine
          ref: main
          path: civ-engine
          persist-credentials: false

      # voxel exports dist/ only, so a checkout without a build installs a link whose
      # voxel/core and voxel/three entrypoints do not exist.
      - name: Checkout voxel (sibling)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: yanfengliu/voxel
          ref: main
          path: voxel
          persist-credentials: false

      - name: Setup Node 24
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: city/.nvmrc
          cache: npm
          cache-dependency-path: |
            city/package-lock.json
            civ-engine/package-lock.json
            voxel/package-lock.json

      - name: Install civ-engine dependencies
        working-directory: civ-engine
        run: npm ci

      - name: Build civ-engine dist
        working-directory: civ-engine
        run: npm run build

      - name: Install voxel dependencies
        working-directory: voxel
        run: npm ci

      - name: Build voxel dist
        working-directory: voxel
        run: npm run build

      - name: Install city dependencies
        working-directory: city
        run: npm ci

      - name: Test (includes the SessionReplayer.selfCheck determinism gate)
        working-directory: city
        run: npm test

      - name: Typecheck
        working-directory: city
        run: npm run typecheck

      - name: Lint
        working-directory: city
        run: npm run lint

      - name: Build
        working-directory: city
        run: npm run build
