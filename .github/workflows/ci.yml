name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout city
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          path: city
          persist-credentials: false
          fetch-depth: 0

      # voxel exports dist/ only, so a checkout without a build installs a link whose
      # voxel/core and voxel/three entrypoints do not exist.
      - name: Checkout voxel (sibling)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: yanfengliu/voxel
          ref: main
          path: voxel
          persist-credentials: false

      - name: Setup Node 24
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: city/.nvmrc
          cache: npm
          cache-dependency-path: |
            city/package-lock.json
            voxel/package-lock.json

      - name: Check Git artifact history
        working-directory: city
        env:
          ARTIFACT_BASE: 0dbda4f4bd1a86f4e86140bd943c4da985ccd4bf
        run: |
          npm run git:artifacts:range -- "$ARTIFACT_BASE" HEAD

      - name: Install voxel dependencies
        working-directory: voxel
        run: npm ci

      - name: Build voxel dist
        working-directory: voxel
        run: npm run build

      - name: Install city dependencies
        working-directory: city
        # voxel was built explicitly above; do not rerun its prepare via the link.
        run: npm ci --ignore-scripts

      - name: Verify installed engine
        working-directory: city
        run: npm run engine:check

      - name: Test (includes the SessionReplayer.selfCheck determinism gate)
        working-directory: city
        run: npm test

      - name: Typecheck
        working-directory: city
        run: npm run typecheck

      - name: Lint
        working-directory: city
        run: npm run lint

      - name: Build
        working-directory: city
        run: npm run build
